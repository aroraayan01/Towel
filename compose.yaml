# Run by deploy/install.sh and deploy/update.sh, which set the variables below.
name: xomexo

services:
  store:
    build:
      context: .
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://xomexo.com}
        APP_UID: ${APP_UID:-1000}
        APP_GID: ${APP_GID:-1000}
    image: xomexo-store
    restart: unless-stopped
    # Stripe, SMTP and admin settings. The database path is fixed below.
    env_file: .env.local
    environment:
      DATABASE_URL: file:/data/xomexo.db
      # Product photos uploaded in /admin, on the same volume as the database
      UPLOADS_DIR: /data/uploads
    volumes:
      - ${XOMEXO_DATA_DIR:?set XOMEXO_DATA_DIR}:/data
    # Only Apache on this machine can reach it
    ports:
      - "127.0.0.1:${XOMEXO_PORT:-3410}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/robots.txt').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
